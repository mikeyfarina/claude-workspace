name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        # Pinned, so CI and a developer's machine agree on what counts as clean.
        run: |
          version=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$version/shellcheck-$version.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-$version/shellcheck"
          shellcheck --version
      - name: Run shellcheck
        run: shellcheck -x bin/paneful lib/*.sh lib/terminals/*.sh lib/providers/*.sh shell/hook.bash

  syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n
        run: |
          for f in bin/paneful lib/*.sh lib/terminals/*.sh lib/providers/*.sh shell/hook.bash; do
            bash -n "$f"
          done
      - name: zsh -n
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
          zsh -n shell/hook.zsh

  formula:
    name: homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: brew style
        # Homebrew only lints formulae that live in a tap, so put it in one.
        run: |
          brew tap-new local/ci --no-git
          cp Formula/paneful.rb "$(brew --repository)/Library/Taps/local/homebrew-ci/Formula/"
          brew style local/ci
          brew audit --strict local/ci/paneful
